<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明辨平台 · P1</title>
<style>
  :root{
    --bg:#ffffff; --panel:#fafafa; --line:#e6e6e6; --text:#1f2328;
    --muted:#6b7280; --brand:#185fa5; --brand-soft:#e6f1fb;
    --ok:#0f6e56; --warn:#854f0b; --warn-soft:#faeeda;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--text);background:var(--bg)}
  .app{display:flex;height:100vh}
  /* 侧栏 */
  .side{width:248px;border-right:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;flex:0 0 248px}
  .brand{padding:16px 16px 12px;font-weight:500;font-size:15px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
  .side-body{flex:1;overflow:auto;padding:0 8px}
  .sect{padding:10px 8px 6px;color:var(--muted);font-size:12px}
  .item{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item:hover{background:#eeeeee}
  .item.on{background:var(--brand-soft);color:var(--brand)}
  button.btn{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
             background:#fff;cursor:pointer;font-size:13px;text-align:left}
  button.btn:hover{background:#f2f2f2}
  .side-foot{padding:10px;border-top:1px solid var(--line)}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;
       align-items:center;gap:10px;flex-wrap:wrap}
  .badge{padding:2px 8px;border-radius:999px;background:var(--brand-soft);
         color:var(--brand);font-size:12px}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
  .log{flex:1;overflow:auto;padding:20px}
  .msg{max-width:820px;margin:0 auto 16px}
  .who{font-size:12px;color:var(--muted);margin-bottom:4px}
  .bubble{padding:10px 14px;border-radius:10px;background:#f6f6f6;white-space:pre-wrap;word-break:break-word}
  .msg.me .bubble{background:var(--brand-soft)}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .composer{border-top:1px solid var(--line);padding:12px 20px}
  .composer .row{max-width:820px;margin:0 auto;display:flex;gap:8px}
  textarea{flex:1;resize:none;height:60px;padding:10px 12px;border:1px solid var(--line);
           border-radius:10px;font:inherit}
  .send{padding:0 18px;border:none;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
  .send:disabled{opacity:.5}
  .mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;width:360px}
  .card input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:8px 0}
  .card button{width:100%;padding:9px;border:none;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">明辨平台<small id="whoami">未登录</small></div>
    <div class="side-body">
      <button class="btn" id="new">＋ 新建对话</button>
      <div class="sect">最近对话</div>
      <div id="list"></div>
    </div>
    <div class="side-foot"><button class="btn" id="logout">退出登录</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <strong id="title">新对话</strong>
      <span class="badge" id="tierBadge">档位：自动</span>
      <span class="badge" id="srcBadge"></span>
      <span style="flex:1"></span>
      <select id="tierSel">
        <option value="auto">自动判断</option>
        <option value="direct">直接答</option>
        <option value="tool">用工具</option>
        <option value="rag">检索答</option>
        <option value="research">深度调研</option>
      </select>
    </div>
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="row">
        <textarea id="input" placeholder="Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="send">发送</button>
      </div>
    </div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="card">
    <strong>登录明辨平台</strong>
    <input id="key" placeholder="mj_…（API Key）" autocomplete="off">
    <button id="login">登录</button>
    <div class="hint">Key 由 <code>scripts/bootstrap.py</code> 创建时生成，只显示一次。</div>
  </div>
</div>

<script>
const K = 'mj_api_key';
let key = localStorage.getItem(K) || '';
let sid = null, tiers = [];

// 服务器上本平台挂在 /mj/ 路径下（80 端口要与 Yuxi 共用），
// 这时所有接口也必须带 /mj 前缀，否则请求会打到 Yuxi 的 nginx 上。
// 本地直接跑（无前缀）时 BASE 为空串，两种部署方式同一份代码都能用。
const BASE = location.pathname.indexOf('/mj') === 0 ? '/mj' : '';

const $ = id => document.getElementById(id);
const api = async (path, opt={}) => {
  opt.headers = Object.assign({'X-API-Key': key, 'Content-Type':'application/json'}, opt.headers||{});
  const r = await fetch(BASE + path, opt);
  if (r.status === 401) { localStorage.removeItem(K); location.reload(); }
  return r;
};

async function boot(){
  const r = await api('/v1/me');
  if(!r.ok) return;
  const me = await r.json();
  $('whoami').textContent = me.user.name + ' · ' + me.user.id;
  $('mask').style.display='none';
  $('app').style.display='flex';
  const t = await (await api('/v1/tiers')).json();
  tiers = t.tiers;
  await refreshList();
  await newSession(false);
}

async function refreshList(){
  const r = await api('/v1/sessions');
  const list = await r.json();
  $('list').innerHTML = '';
  (list.sessions||[]).forEach(s=>{
    const d = document.createElement('div');
    d.className = 'item' + (s.id===sid?' on':'');
    d.textContent = s.title;
    d.onclick = ()=>open(s.id, s.title);
    $('list').appendChild(d);
  });
}

async function newSession(doReload=true){
  const r = await api('/v1/sessions', {method:'POST', body:JSON.stringify({title:'新对话'})});
  if(!r.ok) return;
  const s = (await r.json()).session;
  await refreshList();
  await open(s.id, s.title);
}

async function open(id, title){
  sid = id; $('title').textContent = title;
  const r = await api('/v1/sessions/'+id);
  if(!r.ok) return;
  const d = await r.json();
  $('log').innerHTML='';
  (d.messages||[]).forEach(m=>paint(m.role, m.content, m.tier, m.meta));
  $('log').scrollTop = $('log').scrollHeight;
  await refreshList();
}

function paint(role, content, tier, meta){
  const w = document.createElement('div');
  w.className = 'msg' + (role==='user'?' me':'');
  const who = document.createElement('div'); who.className='who';
  who.textContent = role==='user' ? '我' : ('明辨' + (tier? ' · '+tier : ''));
  const b = document.createElement('div'); b.className='bubble'; b.textContent=content;
  w.appendChild(who); w.appendChild(b);
  if(meta && meta.decision){
    const m=document.createElement('div'); m.className='meta';
    m.textContent = '档位来源：'+meta.decision.source+' · 耗时 '+(meta.elapsed_sec||0)+'s';
    w.appendChild(m);
    setBadge(tier, meta.decision.source);
  }
  if(meta && meta.degradation){
    const m=document.createElement('div'); m.className='meta';
    m.textContent = '⚠️ 已降级：'+meta.degradation;
    w.appendChild(m);
  }
  $('log').appendChild(w);
  $('log').scrollTop = $('log').scrollHeight;
}

function setBadge(tier, src){
  const t = (tiers||[]).find(x=>x.id===tier);
  $('tierBadge').textContent = '档位：' + (t? t.label : (tier||'自动'));
  $('srcBadge').textContent = src ? ('来源：' + (src==='manual'?'手动':src==='session'?'会话偏好':'规则预判')) : '';
}

async function send(){
  const v = $('input').value.trim();
  if(!v || !sid) return;
  $('input').value=''; $('send').disabled=true;
  paint('user', v, '', null);
  const tier = $('tierSel').value;
  const body = {content:v};
  if(tier !== 'auto') body.tier = tier;
  try{
    const r = await api('/v1/sessions/'+sid+'/messages', {method:'POST', body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ paint('assistant', '请求失败：'+(d.detail||r.status), '', null); }
    else { paint('assistant', d.content, d.tier, d.meta); await refreshList(); }
  }catch(e){ paint('assistant', '网络错误：'+e, '', null); }
  $('send').disabled=false;
}

$('login').onclick = async ()=>{
  key = $('key').value.trim();
  if(!key) return;
  localStorage.setItem(K, key);
  await boot();
};
$('new').onclick = ()=>newSession();
$('logout').onclick = ()=>{ localStorage.removeItem(K); location.reload(); };
$('send').onclick = send;
$('input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

if(key) boot();
</script>
</body>
</html>
