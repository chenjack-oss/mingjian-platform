# 明辨平台 · 对外反代
#
# 端口纪律：明辨 api 只监听容器映射出来的 8080，不直接对外。
# /mj/ 前缀在转发时剥掉（proxy_pass 带尾斜杠），后端收到的仍是 /health、/v1/... 原生路径。
# 根路径 / 目前是占位静态页（Yuxi 未部署在本机）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    # ---- 明辨平台 ----
    location /mj/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / 流式输出：必须关掉缓冲，否则 token 会被 nginx 攒着一起发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Agent 一次请求可能跑几分钟（多路召回 + 重排 + 生成）
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---- Agentic RAG 独立服务（完整 10 节点图，POST /rag/agent/query）----
    location /rag/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 单次查询要跑 analyzer→planner→worker×N→aggregate→grader→generator，
        # 实测 30~40s；REQUEST_TIMEOUT_SECONDS=120，这里留到 180s 兜底
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ---- 根路径：直接跳到明辨平台 ----
    # 之前这里放的是占位静态页，结果用户开裸 IP http://<你的服务器IP>/ 看到的是
    # 一个"服务运行中"的空壳，以为服务没起来。改成 302 跳转，两个入口都不会落空。
    # （Yuxi 部署到本机后，把这里改回 proxy_pass http://127.0.0.1:8081 即可。）
    location = / {
        return 302 /mj/;
    }

    location / {
        root /var/www/mj-landing;
        index index.html;
        try_files /index.html =404;
    }
}
